name: Notify

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          # Fallback between issue or pull_request payload
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            EVENT_LABEL="Pull Request"
          else
            EVENT_LABEL="Issue"
          fi

          TEXT="<b>${EVENT_LABEL} ${ACTION}</b> in <code>${REPO}</code>%0A"
          TEXT="${TEXT}<b>Title:</b> ${TITLE}%0A"
          TEXT="${TEXT}<b>By:</b> ${AUTHOR}%0A"
          TEXT="${TEXT}<a href=\"${URL}\">View on GitHub</a>"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
